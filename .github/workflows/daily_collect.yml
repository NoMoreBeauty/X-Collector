name: Daily X Info Collection

# 每天北京时间早上 8:00 运行 (UTC 0:00)
on:
  schedule:
    - cron: '0 0 * * *'
  # 允许手动触发
  workflow_dispatch:

jobs:
  collect_and_report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    # 1. 检出代码
    - name: Checkout code
      uses: actions/checkout@v4
      
    # 2. 设置 Python 环境
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    # 3. 安装依赖
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    # 4. 生成配置文件 (从 Secrets 注入)
    - name: Create config files
      run: |
        # 创建 .env 文件 (用于 API Key 和 邮件配置)
        echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
        echo "EMAIL_SMTP_HOST=${{ secrets.EMAIL_HOST }}" >> .env
        echo "EMAIL_SMTP_PORT=${{ secrets.EMAIL_PORT }}" >> .env
        echo "EMAIL_USERNAME=${{ secrets.EMAIL_USER }}" >> .env
        echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
        echo "EMAIL_FROM=${{ secrets.EMAIL_FROM }}" >> .env
        echo "EMAIL_USE_TLS=true" >> .env
        
        # 创建 config/cookies.txt (用于 X 登录)
        mkdir -p config
        echo "auth_token=${{ secrets.X_AUTH_TOKEN }}" >> config/cookies.txt
        echo "ct0=${{ secrets.X_CT0 }}" >> config/cookies.txt
        
        # 确保 config.yaml 存在
        if [ ! -f config/config.yaml ]; then
          cp config/config.example.yaml config/config.yaml || touch config/config.yaml
        fi
        
    # 5. 运行采集任务
    - name: Run Collector
      run: |
        # 运行主程序: 采集 -> 生成报告 -> 发送邮件
        # --report: 生成报告
        # --notify: 发送邮件 (强制开启)
        python main.py collect --report --notify
      env:
        # 确保 Python 输出不被缓存
        PYTHONUNBUFFERED: 1
        
    # 6. 将报告推送到 reports 分支
    - name: Push Report to Branch
      run: |
        # 配置 Git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 获取最新生成的报告
        REPORT_FILE=$(ls reports/report_*.md | head -n 1)
        if [ -z "$REPORT_FILE" ]; then
          echo "No report file found!"
          exit 0
        fi
        
        # 提取文件名和日期
        FILENAME=$(basename "$REPORT_FILE")
        # 简单的日期提取: report_20260114_... -> 2026/01/14
        DATE_PART=$(echo $FILENAME | cut -d'_' -f2)
        YEAR=${DATE_PART:0:4}
        MONTH=${DATE_PART:4:2}
        DAY=${DATE_PART:6:2}
        
        # 将报告暂存到临时目录
        mkdir -p /tmp/x_reports
        cp "$REPORT_FILE" "/tmp/x_reports/$FILENAME"
        
        # 删除 reports 目录，防止与分支名冲突
        rm -rf reports/
        
        # 切换到 reports 分支
        git fetch origin reports
        git checkout reports
        
        # 创建日期层级目录: 2026/01/14/
        TARGET_DIR="$YEAR/$MONTH/$DAY"
        mkdir -p "$TARGET_DIR"
        
        # 移动报告并更新 README (可选: 更新索引)
        mv "/tmp/x_reports/$FILENAME" "$TARGET_DIR/"
        
        # 提交
        git add "$TARGET_DIR/"
        git commit -m "📝 Add report for $YEAR-$MONTH-$DAY" || echo "No changes to commit"
        git push origin reports
